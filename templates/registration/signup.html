{% extends "base.html" %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h2>Register</h2>
  <p class="text-muted">Use your campus email so we know you are a student.</p>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary">Sign up</button>
  </form>
</div>
{% endblock %}
