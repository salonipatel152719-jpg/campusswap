<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusSwap{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="{% url 'home' %}">CampusSwap</a>
  <div class="ms-auto d-flex flex-wrap gap-2 align-items-center">
    {% if user.is_authenticated %}
      <a class="btn btn-success btn-sm" href="{% url 'listing_create' %}">Post item</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'favorites' %}">Favorites</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'inbox' %}">Inbox</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'profile' %}">{{ user.username }}</a>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}<button class="btn btn-danger btn-sm">Logout</button>
      </form>
    {% else %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
      <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Register</a>
    {% endif %}
  </div>
</nav>
<main class="container my-4 flex-grow-1">
  {% block content %}{% endblock %}
</main>
{% include "footer.html" %}
</body>
</html>
