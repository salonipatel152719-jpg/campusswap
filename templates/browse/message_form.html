{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto">
  <h2>Message seller</h2>
  <p>About: <a href="{{ listing.get_absolute_url }}">{{ listing.title }}</a> (seller: {{ listing.seller.username }})</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Send</button>
  </form>
</div>
{% endblock %}
